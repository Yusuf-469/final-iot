<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. AI - 3D Medical Assistant</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/dr-ai.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Three.js for 3D Model -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script src="js/api.js"></script>
    <script>
        // Dr. AI 3D Model Viewer with Chat Interface
        let scene, camera, renderer, model, raycaster, mouse, isHovered = false, chatOpen = false;
        let messages = [{ sender: 'ai', text: 'Hello! I\'m Dr. AI, your health monitoring assistant. How can I help you today?' }];
        let isTyping = false;

        function initDrAIModel() {
            console.log('🤖 Initializing Dr. AI 3D Model...');

            const canvas = document.getElementById('dr-ai-canvas');
            if (!canvas) {
                console.error('Canvas not found');
                return;
            }

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a3a);

            // Camera positioned for optimal model viewing
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 5);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 5, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // Raycaster for mouse interaction
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Event listeners
            canvas.addEventListener('click', onModelClick);
            canvas.addEventListener('mousemove', onMouseMove);
            window.addEventListener('resize', onWindowResize);

            // Start animation loop
            animate();

            console.log('✅ Dr. AI 3D Model initialized');

            // Load GLB model
            loadGLBModel();
        }

        function animate() {
            requestAnimationFrame(animate);

            if (model) {
                // Gentle floating animation
                const time = Date.now() * 0.001;
                model.position.y = Math.sin(time * 0.5) * 0.05;

                // Hover scale effect
                if (isHovered) {
                    model.scale.setScalar(1.05);
                    canvas.style.cursor = 'pointer';
                } else {
                    model.scale.setScalar(1.0);
                    canvas.style.cursor = 'default';
                }
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function loadGLBModel() {
            console.log('Loading GLB model...');

            const loader = new THREE.GLTFLoader();
            const glbPath = 'models/medical-doctor-3d-model.glb';

            loader.load(
                glbPath,
                function (gltf) {
                    console.log('GLB model loaded successfully!');
                    model = gltf.scene;

                    // Scale and position
                    model.scale.setScalar(2.0);
                    model.position.set(0, 0, 0);

                    // Enable shadows and materials
                    model.traverse(function (child) {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            if (child.material) {
                                child.material.transparent = false;
                                child.material.opacity = 1.0;
                                if (child.material.color) {
                                    const hex = child.material.color.getHex();
                                    if (hex === 0x000000 || hex < 0x333333) {
                                        child.material.color.setHex(0xcccccc);
                                    }
                                }
                            }
                        }
                    });

                    scene.add(model);
                    console.log('GLB Model added to scene');

                    // Fit camera to model
                    const bbox = new THREE.Box3().setFromObject(model);
                    const size = bbox.getSize(new THREE.Vector3());
                    const center = bbox.getCenter(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const distance = maxDim / (2 * Math.tan(Math.PI * camera.fov / 360));
                    camera.position.set(center.x, center.y, center.z + distance * 1.5);
                    camera.lookAt(center);

                    // Hide loading
                    const loading = document.getElementById('dr-ai-loading');
                    if (loading) loading.style.display = 'none';

                    console.log('3D model ready');
                },
                function (progress) {
                    const percent = progress.total > 0 ? Math.round((progress.loaded / progress.total * 100)) : 0;
                    console.log('Loading progress:', percent + '%');
                },
                function (error) {
                    console.error('GLB loading failed:', error);
                    showError('Failed to load 3D model.');
                }
            );
        }

        function onMouseMove(event) {
            const canvas = document.getElementById('dr-ai-canvas');
            const rect = canvas.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            // Check hover
            if (model) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(model, true);
                isHovered = intersects.length > 0;

                // Show/hide tooltip
                let tooltip = document.getElementById('dr-ai-tooltip');
                if (!tooltip) {
                    tooltip = document.createElement('div');
                    tooltip.id = 'dr-ai-tooltip';
                    tooltip.className = 'dr-ai-tooltip';
                    tooltip.textContent = 'Click to talk to Dr AI';
                    document.body.appendChild(tooltip);
                }

                if (isHovered && !chatOpen) {
                    tooltip.style.display = 'block';
                    tooltip.style.left = (event.clientX + 10) + 'px';
                    tooltip.style.top = (event.clientY - 10) + 'px';
                } else {
                    tooltip.style.display = 'none';
                }
            }
        }

        function onModelClick(event) {
            if (!model || chatOpen) return;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(model, true);

            if (intersects.length > 0) {
                console.log('🤖 Model clicked! Opening chat');
                openChat();
            }
        }

        function openChat() {
            chatOpen = true;
            const canvas = document.getElementById('dr-ai-canvas');
            canvas.style.height = '55%';
            renderer.setSize(window.innerWidth, window.innerHeight * 0.55);

            // Create chat panel
            let chatPanel = document.getElementById('dr-ai-chat-panel');
            if (!chatPanel) {
                chatPanel = document.createElement('div');
                chatPanel.id = 'dr-ai-chat-panel';
                chatPanel.className = 'dr-ai-chat-section';

                const header = document.createElement('div');
                header.className = 'dr-ai-chat-header';

                const titleContainer = document.createElement('div');
                titleContainer.className = 'dr-ai-chat-header h2';

                const avatar = document.createElement('div');
                avatar.className = 'avatar';
                const avatarIcon = document.createElement('i');
                avatarIcon.className = 'fas fa-robot';
                avatar.appendChild(avatarIcon);

                const title = document.createElement('h2');
                title.textContent = 'Dr. AI Medical Assistant';
                titleContainer.appendChild(avatar);
                titleContainer.appendChild(title);

                const closeBtn = document.createElement('button');
                closeBtn.className = 'dr-ai-close-btn';
                closeBtn.textContent = '×';
                closeBtn.onclick = closeChat;

                header.appendChild(titleContainer);
                header.appendChild(closeBtn);

                const messagesDiv = document.createElement('div');
                messagesDiv.id = 'dr-ai-messages';
                messagesDiv.className = 'dr-ai-chat-messages';

                const inputArea = document.createElement('div');
                inputArea.className = 'dr-ai-chat-input-area';

                const input = document.createElement('input');
                input.id = 'dr-ai-input';
                input.className = 'dr-ai-input';
                input.type = 'text';
                input.placeholder = 'Ask Dr. AI about your health...';
                input.onkeypress = function(e) {
                    if (e.key === 'Enter') sendMessage();
                };

                const sendBtn = document.createElement('button');
                sendBtn.className = 'dr-ai-send-btn';
                sendBtn.textContent = 'Send';
                sendBtn.onclick = sendMessage;

                inputArea.appendChild(input);
                inputArea.appendChild(sendBtn);

                chatPanel.appendChild(header);
                chatPanel.appendChild(messagesDiv);
                chatPanel.appendChild(inputArea);

                document.body.appendChild(chatPanel);

                // Add initial message
                updateMessages();
            }

            chatPanel.classList.add('open');
        }

        function closeChat() {
            chatOpen = false;
            const canvas = document.getElementById('dr-ai-canvas');
            canvas.style.height = '100%';
            renderer.setSize(window.innerWidth, window.innerHeight);

            const chatPanel = document.getElementById('dr-ai-chat-panel');
            if (chatPanel) chatPanel.classList.remove('open');

            // Hide tooltip
            const tooltip = document.getElementById('dr-ai-tooltip');
            if (tooltip) tooltip.style.display = 'none';
        }

        function sendMessage() {
            const input = document.getElementById('dr-ai-input');
            const message = input.value.trim();
            if (!message) return;

            messages.push({ sender: 'user', text: message });
            updateMessages();
            input.value = '';

            // Show typing
            showTyping(true);

            // Send to API
            fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            })
            .then(res => res.json())
            .then(data => {
                messages.push({ sender: 'ai', text: data.response || 'I\'m sorry, I couldn\'t process your message.' });
                updateMessages();
            })
            .catch(error => {
                console.error('Chat error:', error);
                messages.push({ sender: 'ai', text: 'Sorry, I\'m having trouble connecting. Please try again.' });
                updateMessages();
            })
            .finally(() => {
                showTyping(false);
            });
        }

        function updateMessages() {
            const messagesDiv = document.getElementById('dr-ai-messages');
            if (!messagesDiv) return;

            messagesDiv.innerHTML = '';

            messages.forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `dr-ai-message ${msg.sender}`;

                if (msg.sender === 'ai') {
                    const avatar = document.createElement('div');
                    avatar.className = 'avatar';
                    const icon = document.createElement('i');
                    icon.className = 'fas fa-robot';
                    avatar.appendChild(icon);
                    messageDiv.appendChild(avatar);
                }

                const content = document.createElement('div');
                content.className = 'dr-ai-message-content';
                content.textContent = msg.text;
                messageDiv.appendChild(content);

                messagesDiv.appendChild(messageDiv);
            });

            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showTyping(show) {
            const messagesDiv = document.getElementById('dr-ai-messages');
            if (!messagesDiv) return;

            let typingDiv = document.getElementById('dr-ai-typing');

            if (show) {
                if (!typingDiv) {
                    typingDiv = document.createElement('div');
                    typingDiv.id = 'dr-ai-typing';
                    typingDiv.className = 'dr-ai-typing';

                    const avatar = document.createElement('div');
                    avatar.className = 'avatar';
                    const icon = document.createElement('i');
                    icon.className = 'fas fa-robot';
                    avatar.appendChild(icon);

                    const content = document.createElement('div');
                    content.className = 'dr-ai-typing-content';

                    const indicator = document.createElement('div');
                    indicator.className = 'typing-indicator';

                    for (let i = 0; i < 3; i++) {
                        const dot = document.createElement('span');
                        indicator.appendChild(dot);
                    }

                    content.appendChild(indicator);
                    typingDiv.appendChild(avatar);
                    typingDiv.appendChild(content);
                    messagesDiv.appendChild(typingDiv);
                }
                typingDiv.style.display = 'flex';
            } else if (typingDiv) {
                typingDiv.style.display = 'none';
            }
        }

        function onWindowResize() {
            const canvas = document.getElementById('dr-ai-canvas');
            if (canvas && camera && renderer) {
                camera.aspect = canvas.clientWidth / canvas.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            }
        }

        function showError(message) {
            const loading = document.getElementById('dr-ai-loading');
            if (loading) {
                loading.innerHTML = `<i class="fas fa-exclamation-triangle"></i><div>Error: ${message}</div>`;
            }
            console.error(message);
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Dr. AI 3D Model page loaded');
            initDrAIModel();
        });
    </script>
</head>
<body>
    <div class="dr-ai-container">
        <!-- 3D Model Section -->
        <div class="dr-ai-3d-section">
            <!-- Loading Indicator -->
            <div id="dr-ai-loading" class="dr-ai-loading">
                <i class="fas fa-cog"></i>
                <div>Loading 3D Model...</div>
            </div>

            <!-- 3D Canvas -->
            <canvas id="dr-ai-canvas"></canvas>
        </div>
    </div>
</body>
</html>
