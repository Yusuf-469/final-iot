<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. AI - 3D Medical Assistant</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/dr-ai.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/three@0.157.0/build/three.min.js"></script>
    <script src="https://unpkg.com/@react-three/fiber@8.15.11/dist/react-three-fiber.js"></script>
    <script src="https://unpkg.com/@react-three/drei@9.88.13/dist/index.js"></script>

    <script src="js/api.js"></script>
    <script type="text/babel">
        // Dr. AI React Component
        const { useState, useRef, useEffect } = React;
        const { Canvas, useFrame } = ReactThreeFiber;
        const { useGLTF, Html } = ReactThreeDrei;

        // Preload the GLB model
        useGLTF.preload('/models/medical-doctor-3d-model.glb');

        // 3D Model Component
        function DrAIModel({ onClick, onHover }) {
            const { scene } = useGLTF('/models/medical-doctor-3d-model.glb');
            const modelRef = React.useRef();
            const [hovered, setHovered] = React.useState(false);

            // Auto-rotate and floating animation
            useFrame((state, delta) => {
                if (modelRef.current) {
                    modelRef.current.rotation.y += delta * 0.3; // Slower rotation
                    modelRef.current.position.y = Math.sin(state.clock.elapsedTime * 0.8) * 0.08; // Gentle floating
                }
            });

            // Fit camera to model
            React.useEffect(() => {
                if (scene) {
                    const box = new THREE.Box3().setFromObject(scene);
                    const size = box.getSize(new THREE.Vector3());
                    const center = box.getCenter(new THREE.Vector3());
                    // Camera will be positioned by Canvas component
                }
            }, [scene]);

            const handleClick = () => {
                if (scene) onClick();
            };

            const handleHover = (hovering) => {
                setHovered(hovering);
                onHover(hovering);
            };

            return React.createElement('group', {
                ref: modelRef,
                onClick: handleClick,
                onPointerOver: () => handleHover(true),
                onPointerOut: () => handleHover(false),
                style: { cursor: hovered ? 'pointer' : 'default' }
            }, [
                React.createElement('primitive', { object: scene }),
                hovered && React.createElement(Html, { position: [0, 1.8, 0] },
                    React.createElement('div', {
                        style: {
                            background: 'rgba(0,0,0,0.9)',
                            color: 'white',
                            padding: '6px 10px',
                            borderRadius: '6px',
                            fontSize: '13px',
                            fontWeight: '500',
                            pointerEvents: 'none',
                            border: '1px solid #00ffff',
                            boxShadow: '0 0 12px rgba(0,255,255,0.6)',
                            whiteSpace: 'nowrap'
                        }
                    }, 'Click to chat with Dr. AI')
                )
            ]);
        }

        // Loading Component
        function LoadingFallback() {
            return React.createElement(Html, { center: true },
                React.createElement('div', {
                    style: {
                        color: 'white',
                        fontSize: '16px',
                        textAlign: 'center',
                        background: 'rgba(0,0,0,0.8)',
                        padding: '20px',
                        borderRadius: '10px',
                        border: '1px solid rgba(255,255,255,0.2)'
                    }
                }, [
                    React.createElement('i', {
                        className: 'fas fa-spinner fa-spin',
                        style: { fontSize: '24px', marginBottom: '10px', color: '#00ffff' }
                    }),
                    React.createElement('div', null, 'Loading 3D Model...')
                ])
            );
        }

        // Error Component
        function ErrorFallback({ onRetry }) {
            return React.createElement(Html, { center: true },
                React.createElement('div', {
                    style: {
                        color: 'white',
                        textAlign: 'center',
                        background: 'rgba(0,0,0,0.8)',
                        padding: '20px',
                        borderRadius: '10px',
                        border: '1px solid rgba(255,255,255,0.2)',
                        maxWidth: '300px'
                    }
                }, [
                    React.createElement('i', {
                        className: 'fas fa-exclamation-triangle',
                        style: { fontSize: '32px', marginBottom: '10px', color: '#ff6b6b' }
                    }),
                    React.createElement('div', { style: { fontSize: '16px', marginBottom: '10px' } }, '3D Model Failed to Load'),
                    React.createElement('div', { style: { fontSize: '14px', opacity: 0.8, marginBottom: '15px' } }, 'Please check your connection and try again.'),
                    React.createElement('button', {
                        onClick: onRetry,
                        style: {
                            background: '#007bff',
                            color: 'white',
                            border: 'none',
                            padding: '8px 16px',
                            borderRadius: '5px',
                            cursor: 'pointer'
                        }
                    }, 'Retry')
                ])
            );
        }

        // Chat Component
        function ChatPanel({ isOpen, onClose, messages, onSendMessage, isTyping }) {
            const [input, setInput] = React.useState('');
            const messagesEndRef = React.useRef();

            const scrollToBottom = () => {
                if (messagesEndRef.current) {
                    messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            };

            React.useEffect(() => {
                scrollToBottom();
            }, [messages]);

            const handleSend = () => {
                if (input.trim()) {
                    onSendMessage(input.trim());
                    setInput('');
                }
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter') {
                    handleSend();
                }
            };

            if (!isOpen) return null;

            return React.createElement('div', {
                style: {
                    position: 'fixed',
                    top: 0,
                    left: 0,
                    right: 0,
                    bottom: 0,
                    background: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)',
                    display: 'flex',
                    flexDirection: 'column',
                    zIndex: 1000,
                    padding: '20px'
                }
            }, [
                // Header
                React.createElement('div', {
                    style: {
                        display: 'flex',
                        justifyContent: 'space-between',
                        alignItems: 'center',
                        marginBottom: '20px',
                        paddingBottom: '15px',
                        borderBottom: '1px solid rgba(255,255,255,0.1)'
                    }
                }, [
                    React.createElement('div', {
                        style: { display: 'flex', alignItems: 'center', gap: '12px' }
                    }, [
                        React.createElement('div', {
                            style: {
                                width: '45px',
                                height: '45px',
                                borderRadius: '50%',
                                background: 'linear-gradient(135deg, #007bff, #0056b3)',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center'
                            }
                        }, React.createElement('i', { className: 'fas fa-robot', style: { color: 'white', fontSize: '18px' } })),
                        React.createElement('h2', {
                            style: { margin: 0, color: 'white', fontSize: '1.4rem' }
                        }, 'Dr. AI Assistant')
                    ]),
                    React.createElement('button', {
                        onClick: onClose,
                        style: {
                            background: 'none',
                            border: 'none',
                            color: 'white',
                            fontSize: '24px',
                            cursor: 'pointer',
                            padding: '8px',
                            borderRadius: '50%',
                            transition: 'background 0.3s'
                        },
                        onMouseOver: (e) => e.target.style.background = 'rgba(255,255,255,0.1)',
                        onMouseOut: (e) => e.target.style.background = 'none'
                    }, '×')
                ]),

                // Messages
                React.createElement('div', {
                    style: {
                        flex: 1,
                        overflowY: 'auto',
                        padding: '20px',
                        background: 'rgba(255,255,255,0.05)',
                        borderRadius: '12px',
                        marginBottom: '20px'
                    }
                }, [
                    ...messages.map((msg, index) =>
                        React.createElement('div', {
                            key: index,
                            style: {
                                display: 'flex',
                                marginBottom: '16px',
                                justifyContent: msg.sender === 'user' ? 'flex-end' : 'flex-start'
                            }
                        }, [
                            msg.sender === 'ai' && React.createElement('div', {
                                style: {
                                    width: '36px',
                                    height: '36px',
                                    borderRadius: '50%',
                                    background: 'linear-gradient(135deg, #007bff, #0056b3)',
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    marginRight: '12px',
                                    flexShrink: 0
                                }
                            }, React.createElement('i', { className: 'fas fa-robot', style: { color: 'white', fontSize: '12px' } })),
                            React.createElement('div', {
                                style: {
                                    maxWidth: '70%',
                                    padding: '10px 14px',
                                    borderRadius: '16px',
                                    background: msg.sender === 'user' ? '#007bff' : 'rgba(255,255,255,0.1)',
                                    color: 'white',
                                    lineHeight: '1.4'
                                }
                            }, msg.text)
                        ])
                    ),
                    isTyping && React.createElement('div', {
                        style: { display: 'flex', marginBottom: '16px' }
                    }, [
                        React.createElement('div', {
                            style: {
                                width: '36px',
                                height: '36px',
                                borderRadius: '50%',
                                background: 'linear-gradient(135deg, #007bff, #0056b3)',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center',
                                marginRight: '12px',
                                flexShrink: 0
                            }
                        }, React.createElement('i', { className: 'fas fa-robot', style: { color: 'white', fontSize: '12px' } })),
                        React.createElement('div', {
                            style: {
                                padding: '10px 14px',
                                borderRadius: '16px',
                                background: 'rgba(255,255,255,0.1)',
                                color: 'white',
                                display: 'flex',
                                alignItems: 'center'
                            }
                        }, React.createElement('div', {
                            style: {
                                display: 'flex',
                                gap: '4px'
                            }
                        }, [
                            React.createElement('span', { className: 'typing-dot' }),
                            React.createElement('span', { className: 'typing-dot' }),
                            React.createElement('span', { className: 'typing-dot' })
                        ]))
                    ]),
                    React.createElement('div', { ref: messagesEndRef })
                ]),

                // Input
                React.createElement('div', {
                    style: {
                        display: 'flex',
                        gap: '12px',
                        alignItems: 'center'
                    }
                }, [
                    React.createElement('input', {
                        type: 'text',
                        value: input,
                        onChange: (e) => setInput(e.target.value),
                        onKeyPress: handleKeyPress,
                        placeholder: 'Ask Dr. AI about your health...',
                        style: {
                            flex: 1,
                            padding: '12px 16px',
                            border: '1px solid rgba(255,255,255,0.2)',
                            borderRadius: '25px',
                            background: 'rgba(255,255,255,0.1)',
                            color: 'white',
                            outline: 'none',
                            fontSize: '16px'
                        }
                    }),
                    React.createElement('button', {
                        onClick: handleSend,
                        disabled: !input.trim(),
                        style: {
                            padding: '12px 24px',
                            border: 'none',
                            borderRadius: '25px',
                            background: input.trim() ? 'linear-gradient(135deg, #007bff, #0056b3)' : 'rgba(255,255,255,0.2)',
                            color: 'white',
                            cursor: input.trim() ? 'pointer' : 'not-allowed',
                            fontSize: '16px',
                            fontWeight: '500',
                            transition: 'transform 0.2s'
                        },
                        onMouseOver: (e) => { if (input.trim()) e.target.style.transform = 'scale(1.05)'; },
                        onMouseOut: (e) => e.target.style.transform = 'scale(1)'
                    }, 'Send')
                ])
            ]);
        }

        // Main Dr. AI Component
        function DrAI() {
            const [chatOpen, setChatOpen] = React.useState(false);
            const [messages, setMessages] = React.useState([
                { sender: 'ai', text: 'Hello! I\'m Dr. AI, your health monitoring assistant. How can I help you today?' }
            ]);
            const [isTyping, setIsTyping] = React.useState(false);
            const [modelError, setModelError] = React.useState(false);

            const handleModelClick = () => {
                setChatOpen(true);
            };

            const handleHover = (hovering) => {
                // Handle hover state if needed
            };

            const handleSendMessage = async (message) => {
                setMessages(prev => [...prev, { sender: 'user', text: message }]);
                setIsTyping(true);

                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message })
                    });
                    const data = await response.json();
                    setMessages(prev => [...prev, { sender: 'ai', text: data.response || 'I\'m sorry, I couldn\'t process your message.' }]);
                } catch (error) {
                    console.error('Chat error:', error);
                    setMessages(prev => [...prev, { sender: 'ai', text: 'Sorry, I\'m having trouble connecting. Please try again.' }]);
                } finally {
                    setIsTyping(false);
                }
            };

            const handleRetry = () => {
                setModelError(false);
                window.location.reload();
            };

            return React.createElement('div', { style: { width: '100vw', height: '100vh', background: '#0a0a0a' } }, [
                // Back button
                React.createElement('div', {
                    style: {
                        position: 'absolute',
                        top: '20px',
                        left: '20px',
                        zIndex: 100
                    }
                }, React.createElement('button', {
                    onClick: () => window.location.href = 'dashboard.html',
                    style: {
                        background: 'rgba(0,0,0,0.8)',
                        border: '1px solid rgba(255,255,255,0.2)',
                        color: 'white',
                        padding: '8px 16px',
                        borderRadius: '20px',
                        cursor: 'pointer',
                        display: 'flex',
                        alignItems: 'center',
                        gap: '8px',
                        fontSize: '14px'
                    }
                }, [
                    React.createElement('i', { className: 'fas fa-arrow-left' }),
                    'Back to Dashboard'
                ])),

                // Title
                React.createElement('div', {
                    style: {
                        position: 'absolute',
                        top: '20px',
                        left: '50%',
                        transform: 'translateX(-50%)',
                        zIndex: 100,
                        textAlign: 'center',
                        color: 'white'
                    }
                }, [
                    React.createElement('h1', {
                        style: {
                            margin: '0 0 5px 0',
                            fontSize: '1.8rem',
                            fontWeight: '600',
                            textShadow: '0 0 20px rgba(0,255,255,0.5)'
                        }
                    }, 'Dr. AI Medical Assistant'),
                    React.createElement('p', {
                        style: {
                            margin: 0,
                            opacity: 0.8,
                            fontSize: '0.9rem'
                        }
                    }, 'Interactive 3D Health AI')
                ]),

                // 3D Canvas
                React.createElement('div', {
                    style: {
                        width: '100%',
                        height: chatOpen ? '50%' : '100%',
                        transition: 'height 0.3s ease'
                    }
                },
                    React.createElement('div', { style: { width: '100%', height: '100%' } },
                        React.createElement(React.Suspense, {
                            fallback: React.createElement(LoadingFallback)
                        },
                            modelError ?
                                React.createElement(ErrorFallback, { onRetry: handleRetry }) :
                                React.createElement(Canvas, {
                                    camera: { position: [0, 0, 4], fov: 75 },
                                    style: { background: 'linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%)' }
                                }, [
                                    React.createElement(DrAIModel, {
                                        onClick: handleModelClick,
                                        onHover: handleHover,
                                        onError: () => setModelError(true)
                                    }),
                                    React.createElement('ambientLight', { intensity: 0.6 }),
                                    React.createElement('directionalLight', {
                                        position: [5, 5, 5],
                                        intensity: 1,
                                        castShadow: true
                                    })
                                ])
                        )
                    )
                ),

                React.createElement(ChatPanel, {
                    isOpen: chatOpen,
                    onClose: () => setChatOpen(false),
                    messages: messages,
                    onSendMessage: handleSendMessage,
                    isTyping: isTyping
                }),

                // CSS for typing dots
                React.createElement('style', null, `
                    .typing-dot {
                        width: 6px;
                        height: 6px;
                        border-radius: 50%;
                        background: white;
                        animation: typing 1.4s infinite ease-in-out;
                    }
                    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
                    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
                    @keyframes typing {
                        0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
                        40% { transform: scale(1); opacity: 1; }
                    }
                `)
            ]);
        }

        // Render the app
        const container = document.getElementById('dr-ai-root');
        if (container) {
            const root = ReactDOM.createRoot(container);
            root.render(React.createElement(DrAI));
        }
    </script>
</head>
<body>
    <div id="dr-ai-root"></div>
</body>
</html>
