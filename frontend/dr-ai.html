<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. AI - 3D Medical Assistant</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/dr-ai.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="js/api.js"></script>
    <script type="text/babel">
        // Dr. AI React Component - Simplified Version
        const { useState, useRef, useEffect } = React;

        // Chat Panel Component
        function ChatPanel({ isOpen, onClose, messages, onSendMessage, isTyping }) {
            const [input, setInput] = React.useState('');
            const messagesEndRef = React.useRef();

            const scrollToBottom = () => {
                if (messagesEndRef.current) {
                    messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            };

            React.useEffect(() => {
                scrollToBottom();
            }, [messages]);

            const handleSend = () => {
                if (input.trim()) {
                    onSendMessage(input.trim());
                    setInput('');
                }
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter') {
                    handleSend();
                }
            };

            if (!isOpen) return null;

            return React.createElement('div', {
                style: {
                    position: 'fixed',
                    top: 0,
                    left: 0,
                    right: 0,
                    bottom: 0,
                    background: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)',
                    display: 'flex',
                    flexDirection: 'column',
                    zIndex: 1000,
                    padding: '20px'
                }
            }, [
                // Header
                React.createElement('div', {
                    style: {
                        display: 'flex',
                        justifyContent: 'space-between',
                        alignItems: 'center',
                        marginBottom: '20px',
                        paddingBottom: '15px',
                        borderBottom: '1px solid rgba(255,255,255,0.1)'
                    }
                }, [
                    React.createElement('div', {
                        style: { display: 'flex', alignItems: 'center', gap: '12px' }
                    }, [
                        React.createElement('div', {
                            style: {
                                width: '45px',
                                height: '45px',
                                borderRadius: '50%',
                                background: 'linear-gradient(135deg, #007bff, #0056b3)',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center'
                            }
                        }, React.createElement('i', { className: 'fas fa-robot', style: { color: 'white', fontSize: '18px' } })),
                        React.createElement('h2', {
                            style: { margin: 0, color: 'white', fontSize: '1.4rem' }
                        }, 'Dr. AI Assistant')
                    ]),
                    React.createElement('button', {
                        onClick: onClose,
                        style: {
                            background: 'none',
                            border: 'none',
                            color: 'white',
                            fontSize: '24px',
                            cursor: 'pointer',
                            padding: '8px',
                            borderRadius: '50%',
                            transition: 'background 0.3s'
                        },
                        onMouseOver: (e) => e.target.style.background = 'rgba(255,255,255,0.1)',
                        onMouseOut: (e) => e.target.style.background = 'none'
                    }, '×')
                ]),

                // Messages
                React.createElement('div', {
                    style: {
                        flex: 1,
                        overflowY: 'auto',
                        padding: '20px',
                        background: 'rgba(255,255,255,0.05)',
                        borderRadius: '12px',
                        marginBottom: '20px'
                    }
                }, [
                    ...messages.map((msg, index) =>
                        React.createElement('div', {
                            key: index,
                            style: {
                                display: 'flex',
                                marginBottom: '16px',
                                justifyContent: msg.sender === 'user' ? 'flex-end' : 'flex-start'
                            }
                        }, [
                            msg.sender === 'ai' && React.createElement('div', {
                                style: {
                                    width: '36px',
                                    height: '36px',
                                    borderRadius: '50%',
                                    background: 'linear-gradient(135deg, #007bff, #0056b3)',
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    marginRight: '12px',
                                    flexShrink: 0
                                }
                            }, React.createElement('i', { className: 'fas fa-robot', style: { color: 'white', fontSize: '12px' } })),
                            React.createElement('div', {
                                style: {
                                    maxWidth: '70%',
                                    padding: '10px 14px',
                                    borderRadius: '16px',
                                    background: msg.sender === 'user' ? '#007bff' : 'rgba(255,255,255,0.1)',
                                    color: 'white',
                                    lineHeight: '1.4'
                                }
                            }, msg.text)
                        ])
                    ),
                    isTyping && React.createElement('div', {
                        style: { display: 'flex', marginBottom: '16px' }
                    }, [
                        React.createElement('div', {
                            style: {
                                width: '36px',
                                height: '36px',
                                borderRadius: '50%',
                                background: 'linear-gradient(135deg, #007bff, #0056b3)',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center',
                                marginRight: '12px',
                                flexShrink: 0
                            }
                        }, React.createElement('i', { className: 'fas fa-robot', style: { color: 'white', fontSize: '12px' } })),
                        React.createElement('div', {
                            style: {
                                padding: '10px 14px',
                                borderRadius: '16px',
                                background: 'rgba(255,255,255,0.1)',
                                color: 'white',
                                display: 'flex',
                                alignItems: 'center'
                            }
                        }, React.createElement('div', {
                            style: {
                                display: 'flex',
                                gap: '4px'
                            }
                        }, [
                            React.createElement('span', { className: 'typing-dot' }),
                            React.createElement('span', { className: 'typing-dot' }),
                            React.createElement('span', { className: 'typing-dot' })
                        ]))
                    ]),
                    React.createElement('div', { ref: messagesEndRef })
                ]),

                // Input
                React.createElement('div', {
                    style: {
                        display: 'flex',
                        gap: '12px',
                        alignItems: 'center'
                    }
                }, [
                    React.createElement('input', {
                        type: 'text',
                        value: input,
                        onChange: (e) => setInput(e.target.value),
                        onKeyPress: handleKeyPress,
                        placeholder: 'Ask Dr. AI about your health...',
                        style: {
                            flex: 1,
                            padding: '12px 16px',
                            border: '1px solid rgba(255,255,255,0.2)',
                            borderRadius: '25px',
                            background: 'rgba(255,255,255,0.1)',
                            color: 'white',
                            outline: 'none',
                            fontSize: '16px'
                        }
                    }),
                    React.createElement('button', {
                        onClick: handleSend,
                        disabled: !input.trim(),
                        style: {
                            padding: '12px 24px',
                            border: 'none',
                            borderRadius: '25px',
                            background: input.trim() ? 'linear-gradient(135deg, #007bff, #0056b3)' : 'rgba(255,255,255,0.2)',
                            color: 'white',
                            cursor: input.trim() ? 'pointer' : 'not-allowed',
                            fontSize: '16px',
                            fontWeight: '500',
                            transition: 'transform 0.2s'
                        },
                        onMouseOver: (e) => { if (input.trim()) e.target.style.transform = 'scale(1.05)'; },
                        onMouseOut: (e) => e.target.style.transform = 'scale(1)'
                    }, 'Send')
                ])
            ]);
        }

        // 3D Model Placeholder Component
        function ModelPlaceholder({ onClick }) {
            const [hovered, setHovered] = React.useState(false);

            return React.createElement('div', {
                onClick: onClick,
                onMouseOver: () => setHovered(true),
                onMouseOut: () => setHovered(false),
                style: {
                    width: '100%',
                    height: '100%',
                    background: 'linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%)',
                    display: 'flex',
                    flexDirection: 'column',
                    alignItems: 'center',
                    justifyContent: 'center',
                    color: 'white',
                    cursor: hovered ? 'pointer' : 'default',
                    transition: 'all 0.3s ease'
                }
            }, [
                React.createElement('div', {
                    style: {
                        fontSize: '72px',
                        marginBottom: '20px',
                        color: '#00ffff',
                        animation: hovered ? 'pulse 2s infinite' : 'float 3s ease-in-out infinite',
                        transition: 'all 0.3s ease'
                    }
                }, React.createElement('i', { className: 'fas fa-user-md' })),
                React.createElement('h2', {
                    style: {
                        margin: '0 0 10px 0',
                        fontSize: '2rem',
                        textAlign: 'center',
                        textShadow: '0 0 20px rgba(0,255,255,0.5)'
                    }
                }, 'Dr. AI Medical Assistant'),
                React.createElement('p', {
                    style: {
                        margin: '0 0 20px 0',
                        fontSize: '1.1rem',
                        textAlign: 'center',
                        opacity: 0.8
                    }
                }, 'Interactive 3D Health AI'),
                hovered && React.createElement('div', {
                    style: {
                        background: 'rgba(0,0,0,0.9)',
                        color: 'white',
                        padding: '10px 16px',
                        borderRadius: '8px',
                        fontSize: '14px',
                        fontWeight: '500',
                        border: '1px solid #00ffff',
                        boxShadow: '0 0 15px rgba(0,255,255,0.6)',
                        animation: 'fadeIn 0.3s ease',
                        marginTop: '10px'
                    }
                }, 'Click to start conversation')
            ]);
        }

        // Main Dr. AI Component
        function DrAI() {
            const [chatOpen, setChatOpen] = React.useState(false);
            const [messages, setMessages] = React.useState([
                { sender: 'ai', text: 'Hello! I\'m Dr. AI, your health monitoring assistant. How can I help you today?' }
            ]);
            const [isTyping, setIsTyping] = React.useState(false);

            const handleModelClick = () => {
                setChatOpen(true);
            };

            const handleSendMessage = async (message) => {
                setMessages(prev => [...prev, { sender: 'user', text: message }]);
                setIsTyping(true);

                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message })
                    });
                    const data = await response.json();
                    setMessages(prev => [...prev, { sender: 'ai', text: data.response || 'I\'m sorry, I couldn\'t process your message.' }]);
                } catch (error) {
                    console.error('Chat error:', error);
                    setMessages(prev => [...prev, { sender: 'ai', text: 'Sorry, I\'m having trouble connecting. Please try again.' }]);
                } finally {
                    setIsTyping(false);
                }
            };

            return React.createElement('div', { style: { width: '100vw', height: '100vh', background: '#0a0a0a' } }, [
                // Back button
                React.createElement('div', {
                    style: {
                        position: 'absolute',
                        top: '20px',
                        left: '20px',
                        zIndex: 100
                    }
                }, React.createElement('button', {
                    onClick: () => window.location.href = 'dashboard.html',
                    style: {
                        background: 'rgba(0,0,0,0.8)',
                        border: '1px solid rgba(255,255,255,0.2)',
                        color: 'white',
                        padding: '8px 16px',
                        borderRadius: '20px',
                        cursor: 'pointer',
                        display: 'flex',
                        alignItems: 'center',
                        gap: '8px',
                        fontSize: '14px',
                        transition: 'all 0.3s ease'
                    },
                    onMouseOver: (e) => {
                        e.target.style.background = 'rgba(0,0,0,0.9)';
                        e.target.style.borderColor = 'rgba(255,255,255,0.4)';
                        e.target.style.transform = 'translateX(-2px)';
                    },
                    onMouseOut: (e) => {
                        e.target.style.background = 'rgba(0,0,0,0.8)';
                        e.target.style.borderColor = 'rgba(255,255,255,0.2)';
                        e.target.style.transform = 'translateX(0)';
                    }
                }, [
                    React.createElement('i', { className: 'fas fa-arrow-left' }),
                    'Back to Dashboard'
                ])),

                // 3D Canvas Container
                React.createElement('div', {
                    className: chatOpen ? 'dr-ai-canvas-container chat-open' : 'dr-ai-canvas-container'
                }, React.createElement(ModelPlaceholder, { onClick: handleModelClick })),

                React.createElement(ChatPanel, {
                    isOpen: chatOpen,
                    onClose: () => setChatOpen(false),
                    messages: messages,
                    onSendMessage: handleSendMessage,
                    isTyping: isTyping
                }),

                // CSS for animations
                React.createElement('style', null, `
                    @keyframes pulse {
                        0%, 100% { transform: scale(1); }
                        50% { transform: scale(1.1); }
                    }
                    @keyframes float {
                        0%, 100% { transform: translateY(0px); }
                        50% { transform: translateY(-10px); }
                    }
                    @keyframes fadeIn {
                        0% { opacity: 0; transform: translateY(10px); }
                        100% { opacity: 1; transform: translateY(0); }
                    }
                    .typing-dot {
                        width: 6px;
                        height: 6px;
                        border-radius: 50%;
                        background: white;
                        animation: typing 1.4s infinite ease-in-out;
                    }
                    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
                    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
                    @keyframes typing {
                        0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
                        40% { transform: scale(1); opacity: 1; }
                    }
                `)
            ]);
        }

        // Render the app
        const container = document.getElementById('dr-ai-root');
        if (container) {
            const root = ReactDOM.createRoot(container);
            root.render(React.createElement(DrAI));
        }
    </script>
</head>
<body>
    <div id="dr-ai-root"></div>
</body>
</html>
